# LIFORA Render Blueprint Specification
# Tagline: Your Life. Your Space. Your Rules.
# Infrastructure: Managed PostgreSQL + FastAPI Web Service + React Static Site

databases:
  # LIFORA Managed PostgreSQL Database
  - name: lifora-db
    databaseName: lifora_db
    user: lifora_user
    region: singapore
    plan: free # Change to 'starter' for permanent storage, automated daily backups & high concurrency

services:
  # 1. LIFORA Backend API Service (Python FastAPI Web Service)
  - type: web
    name: lifora-backend
    runtime: python
    region: singapore
    plan: free # or 'starter'
    buildCommand: pip install -r backend/requirements.txt
    preDeployCommand: python -m alembic upgrade head
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_ENV
        value: production
      - key: PROJECT_NAME
        value: LIFORA
      - key: DATABASE_URL
        fromDatabase:
          name: lifora-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: FRONTEND_URL
        value: https://lifora-frontend.onrender.com
      - key: CORS_ORIGINS
        value: '["https://lifora-frontend.onrender.com","https://lifora.onrender.com"]'
      - key: ENABLE_DOCS
        value: "false"
      - key: AI_PROVIDER
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: noreply@lifora.app

  # 2. LIFORA Frontend Application (React + Vite Static Site)
  - type: static
    name: lifora-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: false
    envVars:
      - key: VITE_API_BASE_URL
        value: https://lifora-backend.onrender.com
    routes:
      # SPA rewrite rule: maps all route paths to index.html for React Router
      - type: rewrite
        source: /*
        destination: /index.html
